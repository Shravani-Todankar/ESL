<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision & Mission — Design Options</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f6f0fa;
            color: #1a1a1a;
        }

        .option-label {
            text-align: center;
            padding: 60px 20px 20px;
        }

        .option-label h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #6c32a8;
        }

        .option-label p {
            font-size: 1rem;
            color: #888;
            margin-top: 8px;
        }

        /* =============================================
           OPTION 3: SCROLL-TRIGGERED TEXT REVEAL
           ============================================= */
        .tr-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        .tr-heading { text-align: center; margin-bottom: 60px; }

        .tr-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: start;
        }

        .tr-heading h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #3d2549;
        }

        .tr-heading h2 span { color: #e5a93e; }

        .tr-block {
            margin-bottom: 60px;
            text-align: center;
        }

        .tr-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .tr-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.4;
            color: #3d2549;
        }

        .tr-text .tr-word {
            display: inline-block;
            opacity: 0.12;
            transition: opacity 0.5s, color 0.5s;
            margin-right: 0.3em;
        }

        .tr-text .tr-word.revealed {
            opacity: 1;
        }

        .tr-text .tr-word.highlight {
            color: #6c32a8;
        }

        .tr-text .tr-word.highlight-yellow {
            background: linear-gradient(120deg, #e5a93e30, #e5a93e50);
            padding: 0 6px;
            border-radius: 6px;
        }

        .tr-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #6c32a8, #e5a93e);
            border-radius: 3px;
            margin: 40px auto;
        }

        /* =============================================
           RESPONSIVE
           ============================================= */
        @media (max-width: 768px) {
            .option-label h1 { font-size: 2rem; }
            .tr-grid { grid-template-columns: 1fr; gap: 20px; }
            .tr-text { font-size: 1.6rem; }
        }
    </style>
</head>

<body>

    <!-- ==========================================
         OPTION 3: SCROLL-TRIGGERED TEXT REVEAL
         ========================================== -->
    <div style="height: 40vh;"></div>
    <section class="tr-section" id="trSection">
        <div class="tr-grid">
            <div class="tr-block" id="trVision">
                <div class="tr-label">Our <span style="color: #6c32a8;">Vision</span></div>
                <p class="tr-text" data-highlight="change agents"></p>
            </div>
            <div class="tr-block" id="trMission">
                <div class="tr-label">Our <span style="color: #e5a93e;">Mission</span></div>
                <p class="tr-text" data-highlight="1 million school children,2030."></p>
            </div>
        </div>
    </section>
    <div style="height: 40vh;"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        // === Option 3: Scroll-Triggered Text Reveal ===
        (function () {
            const visionText = "Nurturing a generation of 'change agents' who strive to better their lives and the world around them.";
            const missionText = "Nurturing 1 million school children with an entrepreneurial mindset by 2030.";

            function buildWords(container, text, highlights) {
                const p = container.querySelector('.tr-text');
                const hList = highlights.split(',').map(h => h.trim().toLowerCase());
                text.split(' ').forEach(word => {
                    const span = document.createElement('span');
                    span.className = 'tr-word';
                    span.textContent = word + ' ';
                    const clean = word.replace(/[''.,]/g, '').toLowerCase();
                    for (const h of hList) {
                        if (h.includes(clean) && clean.length > 2) {
                            span.classList.add('highlight');
                            break;
                        }
                    }
                    p.appendChild(span);
                });
            }

            buildWords(document.getElementById('trVision'), visionText, "change,agents");
            buildWords(document.getElementById('trMission'), missionText, "1,million,school,children,2030");

            const visionWords = document.querySelectorAll('#trVision .tr-word');
            const missionWords = document.querySelectorAll('#trMission .tr-word');
            const maxWords = Math.max(visionWords.length, missionWords.length);

            gsap.registerPlugin(ScrollTrigger);

            ScrollTrigger.create({
                trigger: '#trSection',
                pin: true,
                start: 'center center',
                end: '+=' + (maxWords * 120),
                scrub: 0.3,
                onUpdate: function (self) {
                    const revealCount = Math.floor(self.progress * maxWords);
                    visionWords.forEach((w, i) => {
                        w.classList.toggle('revealed', i < revealCount);
                    });
                    missionWords.forEach((w, i) => {
                        w.classList.toggle('revealed', i < revealCount);
                    });
                }
            });
        })();
    </script>

</body>

</html>
